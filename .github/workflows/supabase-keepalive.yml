# Daily keep-alive / restore for a free Supabase project.
# Secrets required:
#   SUPABASE_ACCESS_TOKEN  — personal access token with projects:write
#   SUPABASE_PROJECT_REF   — project ref (xxxx in https://xxxx.supabase.co)
#   SUPABASE_URL           — https://xxxx.supabase.co
#   SUPABASE_ANON_KEY      — publishable / anon key (for the activity ping)

name: supabase-keepalive

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Check status and restore if paused
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF"
            exit 1
          fi
          STATUS=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')
          echo "status=$STATUS"
          if [ "$STATUS" = "INACTIVE" ] || [ "$STATUS" = "GOING_DOWN" ]; then
            echo "Restoring paused project…"
            curl -fsS -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/restore"
            echo "Restore requested; database may take a minute."
            exit 0
          fi
          echo "Project is active."

      - name: Database activity ping
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Skip activity ping (missing SUPABASE_URL or SUPABASE_ANON_KEY)"
            exit 0
          fi
          # A tiny PostgREST call counts as database activity for free-plan pause prevention.
          CODE=$(curl -s -o /tmp/sb-ping.json -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL%/}/rest/v1/projects?select=id&limit=1")
          echo "ping http=$CODE"
          # 200 (rows) or 401/empty RLS is still a database round-trip.
          test "$CODE" != "000"
